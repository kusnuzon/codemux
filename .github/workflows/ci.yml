name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, host-independent checks: nothing here may depend on Termux.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: shellcheck -S warning install.sh bin/codemux lib/*.sh lib/modules/*.sh tools/*.sh tests/*.sh

      - name: syntax
        run: |
          for f in install.sh bin/codemux lib/*.sh lib/modules/*.sh tools/*.sh tests/*.sh; do
            bash -n "$f"
          done

      # The suites must pass both as a Termux user (PREFIX set, Termux layout)
      # and as a plain runner (no PREFIX, /usr/bin layout). Skipping the second
      # run is how four broken test assumptions reached main.
      - name: harness check (mock Termux + plain runner)
        run: bash tests/harness.sh

      # The canonical shared opencode files must match the V1/V2 repos; a
      # canonical edit that was never synced fails here.
      - name: shared opencode files in sync with V1/V2
        run: |
          git clone --depth 1 https://github.com/kusnuzon/opencode-termux /tmp/v1
          git clone --depth 1 https://github.com/kusnuzon/opencode-termux-v2 /tmp/v2
          bash tools/sync-opencode-files.sh --check /tmp/v1 /tmp/v2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # with-prefix mocks Termux; without-prefix is a plain runner.
        env: [with-prefix, without-prefix]
    steps:
      - uses: actions/checkout@v4

      - name: check --json valid
        run: |
          if [ "${{ matrix.env }}" = "with-prefix" ]; then
            export PREFIX="$RUNNER_TEMP/prefix" TMPDIR="$RUNNER_TEMP"
            mkdir -p "$PREFIX/bin" "$PREFIX/tmp"
          fi
          bash bin/codemux check --json > "$RUNNER_TEMP/out.json" || true
          python3 - "$RUNNER_TEMP/out.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["codemux"] == "codemux"
          mods = d["modules"]
          r = d["summary"]
          assert len(mods) == 15, len(mods)   # pi + skills modules
          assert r["ok"] + r["warn"] + r["miss"] + r["fail"] + r["skip"] == len(mods), r
          assert all(m["module"] and m["status"] for m in mods), mods
          assert d["components"] in ("v1", "v2", "v1 v2", "pi"), d["components"]
          print("json ok:", r)
          PY

      - name: suites (${{ matrix.env }})
        run: |
          if [ "${{ matrix.env }}" = "with-prefix" ]; then
            export PREFIX="$RUNNER_TEMP/prefix" TMPDIR="$RUNNER_TEMP"
            mkdir -p "$PREFIX/bin" "$PREFIX/tmp"
            env | grep -E '^PREFIX=' # prove the run really had a Termux-like PREFIX
            run=bash
          else
            unset PREFIX
            env | grep -E '^PREFIX=' && { echo "PREFIX must not be set here"; exit 1; }
            run=bash
          fi
          # tools/run-tests.sh runs the suites in parallel (one sandbox each) and
          # prints one summary. -j1 keeps CI logs readable and its runners only
          # have two cores; a failure still shows the FAIL lines.
          $run tools/run-tests.sh -j1 -k

  # The progress bar lives in three repos. Check out the siblings next to
  # this repo so the drift check is real; a drifted copy fails the job.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: codemux
      - uses: actions/checkout@v4
        with:
          repository: kusnuzon/opencode-termux
          path: opencode-termux
      - uses: actions/checkout@v4
        with:
          repository: kusnuzon/opencode-termux-v2
          path: opencode-termux-v2
      - name: sync check (progress bar)
        run: bash codemux/tools/sync-progress-bar.sh --check
